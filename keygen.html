<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MNHUT Keygen (offline)</title>
<style>
body{font-family:system-ui,sans-serif;max-width:520px;margin:0 auto;padding:16px;background:#111;color:#eee}
h2{margin:8px 0} .card{background:#1c1c1c;border-radius:12px;padding:14px;margin:10px 0}
select,input,button{font-size:16px;padding:10px;border-radius:8px;border:1px solid #444;width:100%;box-sizing:border-box;margin:6px 0}
button{background:#2e7d32;color:#fff;border:none;font-weight:bold}
button:active{opacity:.7}
.key{font-size:20px;font-weight:bold;letter-spacing:1px;background:#000;padding:12px;border-radius:8px;text-align:center;margin:8px 0;word-break:break-all}
.ok{color:#4caf50}.err{color:#f44336}
small{color:#999}
</style>
</head>
<body>
<h2>MNHUT VIP Keygen <small>offline - không cần mạng</small></h2>
<div class="card">
<label>Gói:</label>
<select id="days">
<option value="7">7 ngày</option>
<option value="30" selected>30 ngày</option>
<option value="90">90 ngày</option>
<option value="30000">Vĩnh viễn</option>
</select>
<label style="margin-top:8px;display:block">Mã máy (Device ID) - <i>tùy chọn:</i></label>
<input id="dev" placeholder="Để trống nếu là key tự do (không khóa máy)">
<button onclick="gen()">Tạo key MNHUT</button>
<div class="key" id="out">...</div>
<div id="exp"></div>
<button onclick="copyKey()">Copy key</button>
</div>
<div class="card">
<label>Check key:</label>
<input id="chk" placeholder="MNHUT-XXXXX-XXXXX-XXXXX">
<button onclick="check()">Kiểm tra</button>
<div id="res"></div>
</div>
<small>File này chứa SALT đẻ key - GIỮ KÍN, ai có file là tự đẻ key được.</small>
<script>
var MnhutKey = (function () {
  var ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
  var EPOCH_DAY = Math.floor(Date.UTC(2025, 0, 1) / 86400000); // 20089
  var MAX_EXP = 32767;

  // --- SHA-256 (sync, khong phu thuoc) ---
  var K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
  0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
  0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
  0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
  0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
  0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
  0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
  0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];

  function rotr(x, n) { return (x >>> n) | (x << (32 - n)); }
  function ch(x, y, z) { return (x & y) ^ (~x & z); }
  function maj(x, y, z) { return (x & y) ^ (x & z) ^ (y & z); }
  function s0(x) { return rotr(x, 2) ^ rotr(x, 13) ^ rotr(x, 22); }
  function s1(x) { return rotr(x, 6) ^ rotr(x, 11) ^ rotr(x, 25); }
  function g0(x) { return rotr(x, 7) ^ rotr(x, 18) ^ (x >>> 3); }
  function g1(x) { return rotr(x, 17) ^ rotr(x, 19) ^ (x >>> 10); }

  function sha256(bytes) {
    var l = bytes.length;
    var bitLen = l * 8;
    var padLen = (l % 64 < 56) ? (56 - l % 64) : (120 - l % 64);
    var totalLen = l + padLen + 8;
    var msg = new Uint8Array(totalLen);
    msg.set(bytes, 0);
    msg[l] = 0x80;
    var hi = Math.floor(bitLen / 0x100000000);
    var lo = bitLen >>> 0;
    msg[totalLen - 8] = (hi >>> 24) & 0xff;
    msg[totalLen - 7] = (hi >>> 16) & 0xff;
    msg[totalLen - 6] = (hi >>> 8) & 0xff;
    msg[totalLen - 5] = hi & 0xff;
    msg[totalLen - 4] = (lo >>> 24) & 0xff;
    msg[totalLen - 3] = (lo >>> 16) & 0xff;
    msg[totalLen - 2] = (lo >>> 8) & 0xff;
    msg[totalLen - 1] = lo & 0xff;

    var h0 = 0x6a09e667, h1 = 0xbb67ae85, h2 = 0x3c6ef372, h3 = 0xa54ff53a;
    var h4 = 0x510e527f, h5 = 0x9b05688c, h6 = 0x1f83d9ab, h7 = 0x5be0cd19;
    var w = new Uint32Array(64);

    for (var i = 0; i < totalLen; i += 64) {
      for (var t = 0; t < 16; t++) {
        var o = i + t * 4;
        w[t] = ((msg[o]<<24) | (msg[o+1]<<16) | (msg[o+2]<<8) | msg[o+3]) >>> 0;
      }
      for (var t = 16; t < 64; t++) {
        w[t] = (g1(w[t-2]) + w[t-7] + g0(w[t-15]) + w[t-16]) >>> 0;
      }
      var a = h0, b = h1, c = h2, d = h3, e = h4, f = h5, g = h6, h = h7;
      for (var t = 0; t < 64; t++) {
        var t1 = (h + s1(e) + ch(e, f, g) + K[t] + w[t]) >>> 0;
        var t2 = (s0(a) + maj(a, b, c)) >>> 0;
        h = g; g = f; f = e; e = (d + t1) >>> 0;
        d = c; c = b; b = a; a = (t1 + t2) >>> 0;
      }
      h0 = (h0 + a) >>> 0; h1 = (h1 + b) >>> 0; h2 = (h2 + c) >>> 0; h3 = (h3 + d) >>> 0;
      h4 = (h4 + e) >>> 0; h5 = (h5 + f) >>> 0; h6 = (h6 + g) >>> 0; h7 = (h7 + h) >>> 0;
    }
    var out = new Uint8Array(32);
    var hs = [h0, h1, h2, h3, h4, h5, h6, h7];
    for (var k = 0; k < 8; k++) {
      out[k*4]   = (hs[k] >>> 24) & 0xff;
      out[k*4+1] = (hs[k] >>> 16) & 0xff;
      out[k*4+2] = (hs[k] >>> 8)  & 0xff;
      out[k*4+3] = hs[k] & 0xff;
    }
    return out;
  }

  function hmac(keyBytes, msgBytes) {
    var B = 64;
    var k = new Uint8Array(B);
    if (keyBytes.length > B) {
      var h = sha256(keyBytes);
      k.set(h, 0);
    } else {
      k.set(keyBytes, 0);
    }
    var ipad = new Uint8Array(B);
    var opad = new Uint8Array(B);
    for (var i = 0; i < B; i++) {
      ipad[i] = k[i] ^ 0x36;
      opad[i] = k[i] ^ 0x5c;
    }
    var inner = new Uint8Array(B + msgBytes.length);
    inner.set(ipad, 0);
    inner.set(msgBytes, B);
    var innerHash = sha256(inner);

    var outer = new Uint8Array(B + 32);
    outer.set(opad, 0);
    outer.set(innerHash, B);
    return sha256(outer);
  }

  function utf8(str) {
    var out = [];
    for (var i = 0; i < str.length; i++) {
      var c = str.charCodeAt(i);
      if (c < 0x80) out.push(c);
      else if (c < 0x800) { out.push(0xc0 | (c >> 6)); out.push(0x80 | (c & 0x3f)); }
      else { out.push(0xe0 | (c >> 12)); out.push(0x80 | ((c >> 6) & 0x3f)); out.push(0x80 | (c & 0x3f)); }
    }
    return new Uint8Array(out);
  }

  function enc(n, len) {
    n = n >>> 0;
    var s = '';
    for (var i = 0; i < len; i++) { s = ALPHABET.charAt(n & 31) + s; n >>>= 5; }
    return s;
  }
  function dec(str) {
    var n = 0;
    for (var i = 0; i < str.length; i++) {
      var k = ALPHABET.indexOf(str.charAt(i));
      if (k < 0) return -1;
      n = n * 32 + k;
    }
    return n;
  }
  function sigFor(salt, payload9, tag) {
    tag = tag || 'MNHUT';
    var h = hmac(utf8(salt), utf8(tag + '|' + payload9));
    var v = (((h[0]<<22)|(h[1]<<14)|(h[2]<<6)|(h[3]>>>2)) >>> 0);
    return enc(v, 6);
  }
  function rand30() {
    try {
      var g = (typeof crypto !== 'undefined' && crypto.getRandomValues) ? crypto : null;
      if (g) { var b = new Uint8Array(4); g.getRandomValues(b);
        return ((((b[0]<<22)|(b[1]<<14)|(b[2]<<6)|(b[3]>>>2)) >>> 0) % 1073741824); }
    } catch (e) {}
    return Math.floor(Math.random() * 1073741824);
  }
  function deviceHash(salt, devId) {
    if (!devId) return 'AAAA';
    var h = sha256(utf8(devId.trim().toLowerCase() + salt));
    var v = (((h[0]<<12)|(h[1]<<4)|(h[2]>>>4)) >>> 0);
    return enc(v, 4);
  }
  function issueKey(salt, days, devId, opt) {
    opt = opt || {};
    var today = Math.floor((opt.now || Date.now()) / 86400000);
    var exp = today - EPOCH_DAY + Math.floor(days);
    if (exp > MAX_EXP) exp = MAX_EXP;
    if (exp < 0) exp = 0;
    var flag = devId ? 'DY' : 'DN';
    var devPart = devId ? deviceHash(salt, devId) : enc(opt.rand !== undefined ? opt.rand : rand30(), 4);
    var payload = enc(exp, 3) + flag + devPart;
    var all = payload + sigFor(salt, payload, 'MNHUT');
    return 'MNHUT-' + all.slice(0,5) + '-' + all.slice(5,10) + '-' + all.slice(10,15);
  }
  function verifyKey(salt, key, devId, now) {
    if (!key) return { ok: false, reason: 'empty' };
    var clean = String(key).trim().toUpperCase().replace(/[^A-Z2-7]/g, '');
    if (clean.slice(0,5) === 'MNHUT') clean = clean.slice(5);
    else if (clean.slice(0,4) === 'MICU') clean = clean.slice(4);
    if (clean.length !== 15) return { ok: false, reason: 'bad_format' };
    var payload = clean.slice(0,9), sig = clean.slice(9,15);
    var exp = dec(payload.slice(0,3));
    if (exp < 0) return { ok: false, reason: 'bad_format' };
    var s1 = sigFor(salt, payload, 'MNHUT');
    var s2 = sigFor(salt, payload, 'MICU');
    if (sig !== s1 && sig !== s2) return { ok: false, reason: 'bad_sig' };
    var flag = payload.slice(3, 5);
    var devPart = payload.slice(5, 9);
    if (flag === 'DY' && devId) {
      if (deviceHash(salt, devId) !== devPart) return { ok: false, reason: 'device_mismatch', deviceLocked: true };
    }
    var expEnd = (EPOCH_DAY + exp + 1) * 86400000;
    if ((now || Date.now()) >= expEnd) return { ok: false, reason: 'expired' };
    var d = new Date(expEnd - 1);
    return { ok: true, expDate: d.toISOString().slice(0,10), deviceLocked: flag === 'DY' };
  }
  return { issueKey: issueKey, verifyKey: verifyKey, sha256: sha256, hmac: hmac, EPOCH_DAY: EPOCH_DAY, deviceHash: deviceHash };
})();
if (typeof module !== 'undefined' && module.exports) module.exports = MnhutKey;globalThis.MnhutKey = globalThis.MicuKey = MnhutKey;

var SALT = "S6JKQT3UTCYtHNSvKgHXwRXHaNc248HR";
function gen(){
  var d = parseInt(document.getElementById('days').value, 10);
  var dev = (document.getElementById('dev').value || '').trim();
  var k = MnhutKey.issueKey(SALT, d, dev);
  var v = MnhutKey.verifyKey(SALT, k, dev);
  document.getElementById('out').textContent = k;
  document.getElementById('exp').innerHTML = 'Hết hạn: <b>' + v.expDate + '</b>' + (dev ? ' (Khóa máy: ' + dev + ')' : ' (Tự do)');
}
function copyKey(){
  var t = document.getElementById('out').textContent;
  if (navigator.clipboard) navigator.clipboard.writeText(t);
  else { var i = document.createElement('input'); i.value = t; document.body.appendChild(i); i.select(); document.execCommand('copy'); i.remove(); }
  alert('Đã copy');
}
function check(){
  var k = document.getElementById('chk').value;
  var v = MnhutKey.verifyKey(SALT, k);
  document.getElementById('res').innerHTML = v.ok
    ? '<b class="ok">Key sống. Hết hạn ' + v.expDate + '</b>'
    : '<b class="err">Key lỗi: ' + v.reason + '</b>';
}
</script>
</body>
</html>
