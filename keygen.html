<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Micu Keygen (offline)</title>
<style>
body{font-family:system-ui,sans-serif;max-width:520px;margin:0 auto;padding:16px;background:#111;color:#eee}
h2{margin:8px 0} .card{background:#1c1c1c;border-radius:12px;padding:14px;margin:10px 0}
select,input,button{font-size:16px;padding:10px;border-radius:8px;border:1px solid #444;width:100%;box-sizing:border-box;margin:6px 0}
button{background:#2e7d32;color:#fff;border:none;font-weight:bold}
button:active{opacity:.7}
.key{font-size:20px;font-weight:bold;letter-spacing:1px;background:#000;padding:12px;border-radius:8px;text-align:center;margin:8px 0;word-break:break-all}
.ok{color:#4caf50}.err{color:#f44336}
small{color:#999}
</style>
</head>
<body>
<h2>Micu Keygen <small>offline - không cần mạng</small></h2>
<div class="card">
<label>Gói:</label>
<select id="days">
<option value="7">7 ngày</option>
<option value="30" selected>30 ngày</option>
<option value="90">90 ngày</option>
<option value="30000">Vĩnh viễn</option>
</select>
<label style="margin-top:8px;display:block">Mã máy (Device ID) - <i>tùy chọn:</i></label>
<input id="dev" placeholder="Để trống nếu là key tự do (không khóa máy)">
<button onclick="gen()">Tạo key</button>
<div class="key" id="out">...</div>
<div id="exp"></div>
<button onclick="copyKey()">Copy key</button>
</div>
<div class="card">
<label>Check key:</label>
<input id="chk" placeholder="MICU-XXXXX-XXXXX-XXXXX">
<button onclick="check()">Kiểm tra</button>
<div id="res"></div>
</div>
<small>File này chứa SALT đẻ key - GIỮ KÍN, ai có file là tự đẻ key được.
Nếu lộ thì đổi SALT ở bot + APK rồi build lại.</small>
<script>
// Keygen coreoffline: chay duoc tren Node, browser, WebView (khong can crypto.subtle).
// CUNG THUAT TOAN voi bot (keys.js/keys-w.js) va APK (KeyOffline.java).
// File nay duoc nhung nguyen ven vao keygen.html - sua 1 noi, test 1 noi.
var MicuKey = (function () {
  var ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
  var EPOCH_DAY = Math.floor(Date.UTC(2025, 0, 1) / 86400000); // 20089
  var MAX_EXP = 32767;

  // --- SHA-256 (sync, khong phu thuoc) ---
  var K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
  0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
  0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
  0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
  0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
  0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
  0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
  0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  function rotr(x, n) { return (x >>> n) | (x << (32 - n)); }
  function utf8(s) {
    if (typeof TextEncoder !== 'undefined') return new TextEncoder().encode(s);
    var u = unescape(encodeURIComponent(s)), b = new Uint8Array(u.length);
    for (var i = 0; i < u.length; i++) b[i] = u.charCodeAt(i);
    return b;
  }
  function sha256(msg) {
    var H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
    var ml = msg.length, bl = ml + 1 + 8, pad = (64 - (bl % 64)) % 64;
    var d = new Uint8Array(ml + 1 + pad + 8);
    d.set(msg); d[ml] = 0x80;
    var hi = Math.floor(ml / 4294967296), lo = ml * 8 >>> 0;
    // ghi 64-bit length (msg < 2^32 byte nen hi luon 0, van ghi du cho chuan)
    d[d.length - 8] = (hi >>> 24) & 255; d[d.length - 7] = (hi >>> 16) & 255;
    d[d.length - 6] = (hi >>> 8) & 255; d[d.length - 5] = hi & 255;
    d[d.length - 4] = (lo >>> 24) & 255; d[d.length - 3] = (lo >>> 16) & 255;
    d[d.length - 2] = (lo >>> 8) & 255; d[d.length - 1] = lo & 255;
    var w = new Array(64);
    for (var o = 0; o < d.length; o += 64) {
      for (var i = 0; i < 16; i++)
        w[i] = ((d[o+i*4]<<24)|(d[o+i*4+1]<<16)|(d[o+i*4+2]<<8)|d[o+i*4+3]) >>> 0;
      for (i = 16; i < 64; i++) {
        var s0 = rotr(w[i-15],7)^rotr(w[i-15],18)^(w[i-15]>>>3);
        var s1 = rotr(w[i-2],17)^rotr(w[i-2],19)^(w[i-2]>>>10);
        w[i] = (w[i-16]+s0+w[i-7]+s1) >>> 0;
      }
      var a=H[0],b=H[1],c=H[2],dd=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
      for (i = 0; i < 64; i++) {
        var S1 = rotr(e,6)^rotr(e,11)^rotr(e,25);
        var ch = (e&f)^((~e)&g);
        var t1 = (h+S1+ch+K[i]+w[i]) >>> 0;
        var S0 = rotr(a,2)^rotr(a,13)^rotr(a,22);
        var mj = (a&b)^(a&c)^(b&c);
        var t2 = (S0+mj) >>> 0;
        h=g; g=f; f=e; e=(dd+t1)>>>0; dd=c; c=b; b=a; a=(t1+t2)>>>0;
      }
      H[0]=(H[0]+a)>>>0; H[1]=(H[1]+b)>>>0; H[2]=(H[2]+c)>>>0; H[3]=(H[3]+dd)>>>0;
      H[4]=(H[4]+e)>>>0; H[5]=(H[5]+f)>>>0; H[6]=(H[6]+g)>>>0; H[7]=(H[7]+h)>>>0;
    }
    var out = new Uint8Array(32);
    for (i = 0; i < 8; i++) { out[i*4]=H[i]>>>24; out[i*4+1]=(H[i]>>>16)&255; out[i*4+2]=(H[i]>>>8)&255; out[i*4+3]=H[i]&255; }
    return out;
  }
  function hmac(key, msg) {
    if (key.length > 64) key = sha256(key);
    var kb = new Uint8Array(64); kb.set(key);
    var ip = new Uint8Array(64), op = new Uint8Array(64);
    for (var i = 0; i < 64; i++) { ip[i] = kb[i]^0x36; op[i] = kb[i]^0x5c; }
    var inner = new Uint8Array(64 + msg.length); inner.set(ip); inner.set(msg, 64);
    var outer = new Uint8Array(64 + 32); outer.set(op); outer.set(sha256(inner), 64);
    return sha256(outer);
  }

  // --- Base32 so ---
  function enc(n, len) {
    n = n >>> 0; var s = '';
    for (var i = 0; i < len; i++) { s = ALPHABET.charAt(n & 31) + s; n >>>= 5; }
    return s;
  }
  function dec(str) {
    var n = 0;
    for (var i = 0; i < str.length; i++) {
      var k = ALPHABET.indexOf(str.charAt(i));
      if (k < 0) return -1;
      n = n * 32 + k;
    }
    return n;
  }
  function sigFor(salt, payload9) {
    var h = hmac(utf8(salt), utf8('MICU|' + payload9));
    var v = (((h[0]<<22)|(h[1]<<14)|(h[2]<<6)|(h[3]>>>2)) >>> 0);
    return enc(v, 6);
  }
  function rand30() {
    try {
      var g = (typeof crypto !== 'undefined' && crypto.getRandomValues) ? crypto : null;
      if (g) { var b = new Uint8Array(4); g.getRandomValues(b);
        return ((((b[0]<<22)|(b[1]<<14)|(b[2]<<6)|(b[3]>>>2)) >>> 0) % 1073741824); }
    } catch (e) {}
    return Math.floor(Math.random() * 1073741824);
  }
  function deviceHash(salt, devId) {
    if (!devId) return 'AAAA';
    var h = sha256(utf8(devId.trim().toLowerCase() + salt));
    var v = (((h[0]<<12)|(h[1]<<4)|(h[2]>>>4)) >>> 0);
    return enc(v, 4);
  }
  // days: so ngay tu hom nay. devId: ma may (tuy chon). opt {rand, now} de test determinism.
  function issueKey(salt, days, devId, opt) {
    opt = opt || {};
    var today = Math.floor((opt.now || Date.now()) / 86400000);
    var exp = today - EPOCH_DAY + Math.floor(days);
    if (exp > MAX_EXP) exp = MAX_EXP;
    if (exp < 0) exp = 0;
    var flag = devId ? 'DY' : 'DN';
    var devPart = devId ? deviceHash(salt, devId) : enc(opt.rand !== undefined ? opt.rand : rand30(), 4);
    var payload = enc(exp, 3) + flag + devPart;
    var all = payload + sigFor(salt, payload);
    return 'MICU-' + all.slice(0,5) + '-' + all.slice(5,10) + '-' + all.slice(10,15);
  }
  function verifyKey(salt, key, devId, now) {
    if (!key) return { ok: false, reason: 'empty' };
    var clean = String(key).trim().toUpperCase().replace(/[^A-Z2-7]/g, '');
    if (clean.slice(0,4) === 'MICU') clean = clean.slice(4);
    if (clean.length !== 15) return { ok: false, reason: 'bad_format' };
    var payload = clean.slice(0,9), sig = clean.slice(9,15);
    var exp = dec(payload.slice(0,3));
    if (exp < 0) return { ok: false, reason: 'bad_format' };
    if (sigFor(salt, payload) !== sig) return { ok: false, reason: 'bad_sig' };
    var flag = payload.slice(3, 5);
    var devPart = payload.slice(5, 9);
    if (flag === 'DY' && devId) {
      if (deviceHash(salt, devId) !== devPart) return { ok: false, reason: 'device_mismatch', deviceLocked: true };
    }
    var expEnd = (EPOCH_DAY + exp + 1) * 86400000;
    if ((now || Date.now()) >= expEnd) return { ok: false, reason: 'expired' };
    var d = new Date(expEnd - 1);
    return { ok: true, expDate: d.toISOString().slice(0,10), deviceLocked: flag === 'DY' };
  }
  return { issueKey: issueKey, verifyKey: verifyKey, sha256: sha256, hmac: hmac, EPOCH_DAY: EPOCH_DAY, deviceHash: deviceHash };
})();
if (typeof module !== 'undefined' && module.exports) module.exports = MicuKey;

var SALT = "S6JKQT3UTCYtHNSvKgHXwRXHaNc248HR";
function gen(){
  var d = parseInt(document.getElementById('days').value, 10);
  var dev = (document.getElementById('dev').value || '').trim();
  var k = MicuKey.issueKey(SALT, d, dev);
  var v = MicuKey.verifyKey(SALT, k, dev);
  document.getElementById('out').textContent = k;
  document.getElementById('exp').innerHTML = 'Hết hạn: <b>' + v.expDate + '</b>' + (dev ? ' (Khóa máy: ' + dev + ')' : ' (Tự do)');
}
function copyKey(){
  var t = document.getElementById('out').textContent;
  if (navigator.clipboard) navigator.clipboard.writeText(t);
  else { var i = document.createElement('input'); i.value = t; document.body.appendChild(i); i.select(); document.execCommand('copy'); i.remove(); }
  alert('Đã copy');
}
function check(){
  var k = document.getElementById('chk').value;
  var v = MicuKey.verifyKey(SALT, k);
  document.getElementById('res').innerHTML = v.ok
    ? '<b class="ok">Key sống. Hết hạn ' + v.expDate + '</b>'
    : '<b class="err">Key lỗi: ' + v.reason + '</b>';
}
</script>
</body>
</html>
