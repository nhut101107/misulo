{name: Deploy, "on": [push, workflow_dispatch], jobs: {deploy: {runs-on: ubuntu-latest, steps: [{uses: actions/checkout@v4}, {name: Deploy, working-directory: bot/cf-worker, run: "export CLOUDFLARE_API_TOKEN=$(echo \"$CLOUDFLARE_API_TOKEN\" | sed 's/^Cfut_/cfut_/' | tr -d '[:space:]') && sed -i '/d1_databases/,$d' wrangler.toml && sed -i 's/tgSend(env.BOT_TOKEN, o.user_id/await tgSend(env.BOT_TOKEN, targetUserId/' worker.js && npm install && npx wrangler deploy && npx wrangler deploy --name mnhut-vip-bot", env: {CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"}}]}}}
