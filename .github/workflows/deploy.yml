{name: Deploy, "on": [push, workflow_dispatch], jobs: {deploy: {runs-on: ubuntu-latest, steps: [{uses: actions/checkout@v4}, {name: Deploy, working-directory: bot/cf-worker, run: "npm install && (npx wrangler kv namespace create MNHUT_KV || true) && KV_ID=$(npx wrangler kv namespace list | jq -r '.[0].id') && printf 'name = \"mnhut-vip-bot\"\\nmain = \"worker.js\"\\ncompatibility_date = \"2024-09-23\"\\nworkers_dev = true\\n[[kv_namespaces]]\\nbinding = \"MNHUT_KV\"\\nid = \"%s\"\\n[[kv_namespaces]]\\nbinding = \"DB_KV\"\\nid = \"%s\"\\n' \"$KV_ID\" \"$KV_ID\" > wrangler.toml && npx wrangler deploy", env: {CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"}}]}}}
